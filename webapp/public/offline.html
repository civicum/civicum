<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIVICUM — Sin conexión</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; background: #FAFAF8; color: #1a202c; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
      .container { text-align: center; max-width: 400px; }
      .logo { font-size: 48px; margin-bottom: 16px; }
      h1 { font-size: 24px; margin-bottom: 12px; color: #C2503A; }
      p { color: #4a5568; margin-bottom: 24px; line-height: 1.6; }
      button { background: #C2503A; color: white; border: none; padding: 12px 32px; rounded: 8px; font-size: 16px; cursor: pointer; }
      button:hover { background: #A03E2E; }
      .tip { font-size: 13px; color: #718096; margin-top: 20px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">🏛️</div>
      <h1>Sin conexión a internet</h1>
      <p>Tu conexión se perdió, pero tus datos están seguros. Revisa tu conexión y vuelve a intentar.</p>
      <button onclick="window.location.href='/'">Reintentar</button>
      <p class="tip">CIVICUM guardó lo que estabas haciendo. Volverás justo donde quedaste.</p>
    </div>
  </body>
</html>
